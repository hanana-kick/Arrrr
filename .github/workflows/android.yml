name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact source used by this run
        run: git archive --format=zip HEAD -o source-snapshot.zip
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: source-snapshot.zip
          if-no-files-found: error
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore existing preview signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: arrrr-debug-signing-v1
      - name: Test, lint and build all variants
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --stacktrace
      - name: Verify in-place upgrade signing certificate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download preview-efe6dd4 --pattern 'Arrrr-0.2.0-preview.apk' --dir previous
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          old_cert=$("$signer" verify --print-certs previous/Arrrr-0.2.0-preview.apk | grep 'certificate SHA-256 digest:' | head -1)
          new_cert=$("$signer" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep 'certificate SHA-256 digest:' | head -1)
          test "$old_cert" = "$new_cert" || { echo 'Preview signing key changed. Refusing a non-upgradeable release.'; exit 1; }
          echo "$new_cert"
      - uses: actions/upload-artifact@v4
        with:
          name: Arrrr-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports
            app/build/test-results

  ui-tests:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - layout: compact
            size: 720x1600
          - layout: wide
            size: 2040x1540
          - layout: short
            size: 1800x800
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native reading, gesture and storage tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell rm -rf /sdcard/Download/ArrrrScreenshots
            adb shell wm size ${{ matrix.size }}
            adb shell wm density 320
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.layout=${{ matrix.layout }} --stacktrace
            mkdir -p ui-screenshots
            adb pull /sdcard/Download/ArrrrScreenshots/. ui-screenshots/
            test "$(find ui-screenshots -name '*.png' -size +4k | wc -l)" -ge 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-${{ matrix.layout }}
          path: |
            ui-screenshots
            app/build/reports/androidTests
            app/build/outputs/androidTest-results

  preview-release:
    needs: [build, ui-tests]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Arrrr-debug-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          pattern: native-ui-*
          path: test-evidence
      - name: Publish tested preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="preview-${GITHUB_SHA:0:7}"
          cp apk/app-debug.apk Arrrr-0.3.0-preview.apk
          sha256sum Arrrr-0.3.0-preview.apk > SHA256SUMS.txt
          find test-evidence -path '*/ui-screenshots/*.png' -print | zip -@ native-screenshots.zip
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" Arrrr-0.3.0-preview.apk SHA256SUMS.txt native-screenshots.zip \
              --target "$GITHUB_SHA" --prerelease --title "Arrrr 0.3.0 preview (${GITHUB_SHA:0:7})" \
              --notes-file docs/RELEASE_NOTES.md
          fi
