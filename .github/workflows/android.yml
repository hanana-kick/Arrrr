name: Android CI

on:
  push:
    branches: [main, 'implementation/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install build SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Preserve preview signing identity (not a production key)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: arrrr-debug-signing-v1
      - name: Test, lint and build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Arrrr-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports
            app/build/test-results

  ui-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native compact and expanded UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell rm -rf /sdcard/Download/ArrrrScreenshots
            adb shell wm size 824x1784
            adb shell wm density 320
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.layout=compact --stacktrace
            mkdir -p ui-screenshots/compact
            adb pull /sdcard/Download/ArrrrScreenshots/. ui-screenshots/compact/
            adb shell rm -rf /sdcard/Download/ArrrrScreenshots
            adb shell wm size 2040x1540
            adb shell wm density 320
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.layout=wide --rerun-tasks --stacktrace
            mkdir -p ui-screenshots/wide
            adb pull /sdcard/Download/ArrrrScreenshots/. ui-screenshots/wide/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-tests
          path: |
            ui-screenshots
            app/build/reports/androidTests
            app/build/outputs/androidTest-results

  preview-release:
    needs: [build, ui-tests]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Arrrr-debug-apk
          path: apk
      - name: Publish installable preview APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="preview-${GITHUB_SHA:0:7}"
          cp apk/app-debug.apk Arrrr-0.2.0-preview.apk
          sha256sum Arrrr-0.2.0-preview.apk > SHA256SUMS.txt
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" Arrrr-0.2.0-preview.apk SHA256SUMS.txt \
              --target "$GITHUB_SHA" --prerelease --title "Arrrr 0.2.0 preview (${GITHUB_SHA:0:7})" \
              --notes-file docs/RELEASE_NOTES.md
          fi
